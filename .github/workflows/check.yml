name: Validate experiments
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no GPU or model download)
        run: python -m unittest discover -s tests -v
      - name: Validate 20 archived runs
        run: python scripts/audit_results.py --output-dir /tmp/apc-report
      - name: Check repository evidence and links
        run: python scripts/check_repository.py
