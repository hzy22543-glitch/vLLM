name: Validate experiments
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and regression tests (no GPU)
        run: python -m unittest discover -s tests -v
      - name: Validate all 35 archived runs
        run: python scripts/analyze_project.py --output-dir /tmp/project-report
      - name: Verify reproducible derived reports
        run: |
          for file in /tmp/project-report/*; do
            diff -u "reports/$(basename "$file")" "$file"
          done
      - name: Check evidence, provenance and links
        run: python scripts/check_repository.py
